[package]
name = "lite-orm-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Schema and code generation CLI for lite-orm"
repository = "https://github.com/unixipher/lite-orm"
homepage = "https://github.com/unixipher/lite-orm"
documentation = "https://docs.rs/lite-orm"
readme = "../README.md"
keywords = ["orm", "postgresql", "database", "migration", "cli"]
categories = ["database", "command-line-utilities", "development-tools"]
publish = ["crates-io"]

[[bin]]
name = "liteorm"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
heck = "0.5"
lite-orm = { path = "..", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
uuid = { version = "1", features = ["serde", "v4"] }

