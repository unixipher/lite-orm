[package]
name = "lite-orm-studio"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A lightweight desktop database studio for LiteORM"
repository = "https://github.com/unixipher/lite-orm"
homepage = "https://github.com/unixipher/lite-orm"
documentation = "https://docs.rs/lite-orm-studio"
readme = "../README.md"
keywords = ["orm", "postgresql", "database", "studio", "gui"]
categories = ["database", "development-tools"]
publish = ["crates-io"]

[dependencies]
dioxus = { version = "0.6.3", features = ["desktop"] }
lite-orm = { path = "..", version = "0.1.2" }
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
