[workspace]
members = [".", "lite-orm-cli", "lite-orm-macros"]
resolver = "2"

[package]
name = "lite-orm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A small, strongly typed ORM for Rust"
repository = "https://github.com/mrinmoyhalder/lite-orm"

[dependencies]
bytes = "1"
chrono = "0.4"
dotenvy = "0.15"
lite-orm-macros = { path = "lite-orm-macros", version = "0.1.0" }
serde_json = "1"
rustls-tokio-postgres = { version = "0.5", features = ["platform-verifier"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
uuid = "1"

[dev-dependencies]

