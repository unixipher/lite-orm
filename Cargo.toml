[workspace]
members = [".", "lite-orm-cli", "lite-orm-macros", "demo", "lite-orm-studio"]
resolver = "2"

[package]
name = "lite-orm"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A lightweight, schema-first PostgreSQL ORM for Rust"
repository = "https://github.com/unixipher/lite-orm"
homepage = "https://github.com/unixipher/lite-orm"
documentation = "https://docs.rs/lite-orm"
readme = "README.md"
keywords = ["orm", "postgresql", "database", "async", "schema"]
categories = ["database", "asynchronous"]
publish = ["crates-io"]

[dependencies]
bytes = "1"
chrono = "0.4"
dotenvy = "0.15"
form_urlencoded = "1"
lite-orm-macros = { path = "lite-orm-macros", version = "0.1.0" }
serde_json = "1"
rustls-tokio-postgres = { version = "0.5", features = ["platform-verifier"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
uuid = "1"

[dev-dependencies]

